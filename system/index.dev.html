}

// ===== Promos =====
// ===== Brand + litre helpers (derived from the app's own catalogue — no external data) =====
// Brand is inferred from the SKU prefix of PRODUCTS: EFS→Efes, GLB→Goldberg, KRN→Karmen, STL→Stella.
const BRAND_OF_SKU = { EFS: 'Efes', GLB: 'Goldberg', KRN: 'Karmen', STL: 'Stella' };
function skuBrand(sku) { return BRAND_OF_SKU[String(sku).slice(0, 3)] || String(sku).slice(0, 3); }
function promoBrands(p) { return [...new Set(p.products.map(skuBrand))]; }

// This is a litre-volume report. N+1 promos use their litre fields directly; money (N+KZT)
// promos are normalised onto the same litre axis via a demo-only ₸/L constant so every row's
// "LT" columns and realisation bar are populated.
const KZT_PER_LITRE = 650;
function promoLitres(p) {
  if (p.type === 'nplus1') return { quota: p.quotaLitres || 0, used: p.usedLitres || 0 };
  return { quota: Math.round((p.quotaMoney || 0) / KZT_PER_LITRE), used: Math.round((p.usedMoney || 0) / KZT_PER_LITRE) };
}
function realisation(p) { const L = promoLitres(p); return L.quota ? L.used / L.quota : null; }

// ===== Multi-select slicer (Power-BI-style filter card) =====
function Slicer({ icon, title, options, selected, onToggle, onClear, searchable, searchPlaceholder, grid, lang }) {
  const ru = lang === 'ru';
  const [q, setQ] = useStateApp('');
  const shown = useMemoApp(() => {
    if (!searchable || !q.trim()) return options;
    const s = q.toLowerCase();
    return options.filter((o) => o.label.toLowerCase().includes(s));
  }, [options, q, searchable]);
  return (
    <div className="slicer">
      <div className="slicer-head">
        <span className="sl-icon"><Icon name={icon} size={14} /></span>
        <span className="sl-title">{title}</span>
        {selected.size > 0 && <span className="sl-count">{selected.size}</span>}
        <button className="sl-clear" onClick={onClear} disabled={selected.size === 0}>
          <Icon name="close" size={11} />{ru ? 'Сбросить' : 'Clear'}
        </button>
      </div>
      {searchable && (
        <div className="slicer-search">
          <span className="search-icon"><Icon name="search" size={13} /></span>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={searchPlaceholder} />
        </div>
      )}
      <div className={cls('slicer-body', grid && 'grid')}>
        {shown.length === 0
          ? <span className="sl-empty">{ru ? 'Ничего не найдено' : 'No matches'}</span>
          : shown.map((o) => (
            <button key={o.value} className={cls('sl-pill', selected.has(o.value) && 'on')}
              onClick={() => onToggle(o.value)} title={o.label}>
              <span className="sl-check"><Icon name="check" size={11} strokeWidth={2.5} /></span>
              <span className="sl-pill-label">{o.label}</span>
            </button>
          ))}
      </div>
    </div>
  );
}

// ===== Flat promo-activity table (mirrors the "Promo status" report layout) =====
function FlatPromoTable({ t, lang, promos, onSelect, anyFilter, onClearAll }) {
  const ru = lang === 'ru';
  const partnerOf = (p) => PARTNERS.find((x) => x.id === p.partnerId);
  const [sort, setSort] = useStateApp({ col: 'start', dir: 'asc' });

  const fmtDMY = (s) => { const d = new Date(s); const z = (n) => String(n).padStart(2, '0'); return z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear(); };
  const dealLabel = (p) => (p.type === 'nplus1' ? p.nValue + '+1' : 'N+₸');

  const sortVal = (p, col) => {
    const L = promoLitres(p);
    if (col === 'start') return p.startDate;
    if (col === 'end') return p.endDate;
    if (col === 'promo') return (partnerOf(p)?.name || '') + p.code;
    if (col === 'quota') return L.quota;
    if (col === 'used') return L.used;
    if (col === 'left') return L.quota - L.used;
    if (col === 'pct') { const r = realisation(p); return r == null ? -1 : r; }
    return 0;
  };
  const toggleSort = (col) => setSort((s) => (s.col !== col ? { col, dir: 'asc' } : s.dir === 'asc' ? { col, dir: 'desc' } : { col: 'start', dir: 'asc' }));
  const sortInd = (col) => (sort.col === col ? (sort.dir === 'asc' ? '▲' : '▼') : '↕');
  const sortCls = (col) => cls('sort-ind', sort.col === col && sort.dir);

  const rows = useMemoApp(() => {
    const dir = sort.dir === 'asc' ? 1 : -1;
    return promos.slice().sort((a, b) => { const va = sortVal(a, sort.col), vb = sortVal(b, sort.col); return (va < vb ? -1 : va > vb ? 1 : 0) * dir; });
  }, [promos, sort]);

  const totals = useMemoApp(() => {
    let q = 0, u = 0;
    promos.forEach((p) => { const L = promoLitres(p); q += L.quota; u += L.used; });
    return { quota: q, used: u, left: q - u, ratio: q ? u / q : null };
  }, [promos]);

  const lvlOf = (r) => (r == null ? '' : r >= 1 ? 'over' : r >= 0.85 ? 'near' : '');
  const pctTxt = (r) => (r == null ? '—' : Math.round(r * 100) + '%');
  const barCell = (r) => {
    const lvl = lvlOf(r);
    const w = r == null ? 0 : Math.min(100, Math.round(r * 100));
    return (
      <td className={cls('num fl-pct', lvl)}>
        <div className={cls('fl-bar', lvl)}>
          <span className="fl-bar-val">{pctTxt(r)}</span>
          <span className="fl-bar-track"><span className="fl-bar-fill" style={{ width: w + '%' }} /></span>
        </div>
      </td>
    );
  };
  const TH = (col, label, num) => (
    <th className={cls(num && 'num', 'sortable')} onClick={() => toggleSort(col)}>
      <span className="th-inner">{label}<span className={sortCls(col)}>{sortInd(col)}</span></span>
    </th>
  );

  return (
    <>
      <div className="promo-resultbar">
        <span className="rb-count"><b>{promos.length}</b>{ru ? 'промо-активностей' : 'promo-activities'}</span>
        <span className="rb-metric">{ru ? 'Квота' : 'Quota'}<b>{fmtNum(totals.quota)}</b>{ru ? 'Л' : 'L'}</span>
        <span className="rb-metric">{ru ? 'Реализовано' : 'Realised'}<b>{fmtNum(totals.used)}</b>{ru ? 'Л' : 'L'}</span>
        <span className="rb-metric">{ru ? 'Реализация' : 'Realisation'}<b>{pctTxt(totals.ratio)}</b></span>
        {anyFilter && (
          <button className="rb-clear" onClick={onClearAll}><Icon name="close" size={12} />{ru ? 'Сбросить фильтры' : 'Clear filters'}</button>
        )}
      </div>
      <div className="table-wrap flat-wrap">
        <table className="data flat">
          <colgroup>
            <col style={{ width: '112px' }} />
            <col style={{ width: '112px' }} />
            <col />
            <col style={{ width: '96px' }} />
            <col style={{ width: '96px' }} />
            <col style={{ width: '96px' }} />
            <col style={{ width: '188px' }} />
          </colgroup>
          <thead>
            <tr>
              {TH('start', ru ? 'Дата начала' : 'Starting date')}
              {TH('end', ru ? 'Дата окончания' : 'Ending date')}
              {TH('promo', ru ? 'Промо' : 'Promo')}
              {TH('quota', ru ? 'Квота, Л' : 'Promo quota, L', true)}
              {TH('used', ru ? 'Реализ., Л' : 'Quota rlz, L', true)}
              {TH('left', ru ? 'Остаток, Л' : 'Left quota, L', true)}
              {TH('pct', ru ? 'Реализ., %' : 'Quota rlz, %', true)}
            </tr>
          </thead>
          <tbody>
            {rows.map((p) => {
              const L = promoLitres(p); const r = realisation(p); const pt = partnerOf(p);
              return (
                <tr key={p.code} onClick={() => onSelect(p.code)} title={ru ? 'Открыть промо' : 'Open promo'}>
                  <td className="fl-date">{fmtDMY(p.startDate)}</td>
                  <td className="fl-date">{fmtDMY(p.endDate)}</td>
                  <td>
                    <div className="fl-promo">
                      <span className="code-tag">{p.code}</span>
                      <span className="fl-name">
                        <span className="fl-title">{dealLabel(p)} · {pt?.name}</span>
                        <span className="fl-sub">{promoBrands(p).join(', ')} · {findChannelLabel(p.channelIds[0], lang)}</span>
                      </span>
                    </div>
                  </td>
                  <td className="num">{fmtNum(L.quota)}</td>
                  <td className="num">{fmtNum(L.used)}</td>
                  <td className="num">{fmtNum(L.quota - L.used)}</td>
                  {barCell(r)}
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr className="fl-total">
              <td colSpan={3}>{ru ? 'Итого' : 'Total'}</td>
              <td className="num">{fmtNum(totals.quota)}</td>
              <td className="num">{fmtNum(totals.used)}</td>
              <td className="num">{fmtNum(totals.left)}</td>
              {barCell(totals.ratio)}
            </tr>
          </tfoot>
        </table>
        {promos.length === 0 && <div className="empty">{t.misc.noResults}</div>}
      </div>
    </>
  );
}

// ===== Promo activities — Excel-style pivot =====
// Mirrors the "NEW KZT PROMO status" workbook: a compact/outline PivotTable with a
// REGION -> AREA row hierarchy, inline sub-totals, a Grand Total row, KZT number
// formatting, %-conditional formatting and frozen header + first column. Expand any
// area to drill down to its individual promo activities.

// City -> macro-region map (derived from the app's own partner cities; no Excel data copied).
const CITY_REGION = {
  'Almaty': 'SOUTH', 'Shymkent': 'SOUTH', 'Taraz': 'SOUTH', 'Kyzylorda': 'SOUTH', 'Turkestan': 'SOUTH', 'Taldykorgan': 'SOUTH',
  'Astana': 'NORTH', 'Kokshetau': 'NORTH', 'Petropavlovsk': 'NORTH', 'Atbasar': 'NORTH', 'Shuchinsk': 'NORTH', 'Stepnogorsk': 'NORTH', 'Akkol/Yerementau': 'NORTH', 'Pavlodar/Ekibastuz': 'NORTH', 'Kostanay': 'NORTH',
  'Oskemen': 'EAST', 'Semey': 'EAST', 'Ridder': 'EAST', 'Ayagoz': 'EAST', 'Altay': 'EAST', 'Shemonaiha': 'EAST',
  'Aktobe': 'WEST', 'Atyrau': 'WEST', 'Aktau': 'WEST', 'Zhanaozen': 'WEST', 'Oral': 'WEST', 'Kulsary': 'WEST',
  'Karaganda': 'CENTRAL', 'Zhezkazgan': 'CENTRAL', 'Balkhash': 'CENTRAL',
};
const REGION_ORDER = ['NORTH', 'WEST', 'SOUTH', 'EAST', 'CENTRAL', 'OTHER'];
const REGION_LABEL = {
  NORTH:   { en: 'NORTH REGION',    ru: 'СЕВЕРНЫЙ РЕГИОН' },
  WEST:    { en: 'WEST REGION',     ru: 'ЗАПАДНЫЙ РЕГИОН' },
  SOUTH:   { en: 'SOUTH REGION',    ru: 'ЮЖНЫЙ РЕГИОН' },
  EAST:    { en: 'EAST REGION',     ru: 'ВОСТОЧНЫЙ РЕГИОН' },
  CENTRAL: { en: 'CENTRAL REGION',  ru: 'ЦЕНТРАЛЬНЫЙ РЕГИОН' },
  OTHER:   { en: 'OTHER',           ru: 'ПРОЧЕЕ' },
};

// Aggregate a set of promos into the pivot's KZT measures (mirrors the workbook columns).
function aggPromos(list) {
  let quotaMoney = 0, usedMoney = 0;
  const outlets = new Set();
  list.forEach((p) => {
    if (p.type === 'money') { quotaMoney += p.quotaMoney || 0; usedMoney += p.usedMoney || 0; }
    p.salePointIds.forEach((id) => outlets.add(id));
  });
  return { outlets: outlets.size, quotaMoney, usedMoney, leftMoney: quotaMoney - usedMoney, ratio: quotaMoney > 0 ? usedMoney / quotaMoney : null };
}
// One promo's realisation ratio (KZT for money promos, litres for N+1) so every leaf still
// carries a % the conditional-format can colour.
function promoRatio(p) {
  return p.type === 'money'
    ? (p.quotaMoney ? p.usedMoney / p.quotaMoney : null)
    : (p.quotaLitres ? p.usedLitres / p.quotaLitres : null);
}
function leafVal(p, col) {
  if (col === 'outlets') return p.salePointIds.length;
  if (col === 'ratio') { const r = promoRatio(p); return r == null ? -1 : r; }
  if (p.type !== 'money') return -1;
  if (col === 'quotaMoney') return p.quotaMoney || 0;
  if (col === 'usedMoney') return p.usedMoney || 0;
  if (col === 'leftMoney') return (p.quotaMoney || 0) - (p.usedMoney || 0);
  return 0;
}
const fmtPct = (r) => (r == null ? '—' : Math.round(r * 100) + '%');
// Excel cellIs rule was ">100% -> red". We flag >=100% red and >=85% amber so a fully
// consumed quota reads as an alert.
const cfClass = (r) => (r == null ? '' : r >= 1 ? 'cf-over' : r >= 0.85 ? 'cf-near' : '');

// Row-grouping dimensions offered in the "Rows" field selectors.
function pivotDims(lang, t, partnerOf) {
  const seg = (s) => (s === 'ontrade' ? (lang === 'ru' ? 'Он-трейд' : 'On trade') : (lang === 'ru' ? 'Офф-трейд' : 'Off trade'));
  const txt = (a, b) => String(a).localeCompare(String(b));
  return {
    region:  { label: lang === 'ru' ? 'Регион' : 'Region',  key: (p) => CITY_REGION[partnerOf(p)?.city] || 'OTHER', display: (k) => (REGION_LABEL[k] ? REGION_LABEL[k][lang] : k), order: (a, b) => (REGION_ORDER.indexOf(a) - REGION_ORDER.indexOf(b)) || txt(a, b) },
    city:    { label: lang === 'ru' ? 'Город' : 'Area',     key: (p) => partnerOf(p)?.city || '—', display: (k) => k, order: txt },
    partner: { label: t.fields.partner, key: (p) => partnerOf(p)?.name || '—', display: (k) => k, order: txt },
    segment: { label: lang === 'ru' ? 'Сегмент' : 'Segment', key: (p) => partnerOf(p)?.segment || '—', display: (k) => seg(k), order: txt },
    channel: { label: t.fields.channel, key: (p) => findChannelLabel(p.channelIds[0], lang) || '—', display: (k) => k, order: txt },
    type:    { label: t.fields.type, key: (p) => p.type, display: (k) => (k === 'nplus1' ? 'N + 1' : 'N + KZT'), order: txt },
    status:  { label: lang === 'ru' ? 'Статус' : 'Status', key: (p) => p.status, display: (k) => (t.status[k] || k), order: txt },
    owner:   { label: t.fields.createdBy, key: (p) => p.createdBy, display: (k) => k, order: txt },
  };
}

// Excel-pivot-style promo table: outline rows, sub-totals, grand total, conditional
// formatting and frozen panes. Pure React (no TanStack) for full control of the layout.
function PromoTable({ t, lang, promos, searchQuery, onSelect }) {
  const partnerOf = (p) => PARTNERS.find((x) => x.id === p.partnerId);
  const ru = lang === 'ru';

  const [l1, setL1] = useStateApp('region');
  const [l2, setL2] = useStateApp('city');
  const [typeF, setTypeF] = useStateApp('all');
  const [statusF, setStatusF] = useStateApp('all');
  const [channelF, setChannelF] = useStateApp('all');
  const [ownerF, setOwnerF] = useStateApp('all');
  const [sort, setSort] = useStateApp({ col: null, dir: 'desc' });

  const dims = useMemoApp(() => pivotDims(lang, t, partnerOf), [lang, t]);
  const dim1 = dims[l1];
  const dim2 = l2 === 'none' ? null : dims[l2];

  const filtered = useMemoApp(() => promos.filter((p) => {
    if (typeF !== 'all' && p.type !== typeF) return false;
    if (statusF !== 'all' && p.status !== statusF) return false;
    if (channelF !== 'all' && !p.channelIds.includes(channelF)) return false;
    if (ownerF !== 'all' && p.createdBy !== ownerF) return false;
    if (searchQuery) {
      const q = String(searchQuery).toLowerCase();
      const pt = partnerOf(p);
      const hit = p.code.toLowerCase().includes(q) || (pt?.name || '').toLowerCase().includes(q)
        || (pt?.city || '').toLowerCase().includes(q) || (p.createdBy || '').toLowerCase().includes(q)
        || p.products.some((s) => s.toLowerCase().includes(q));
      if (!hit) return false;
    }
    return true;
  }), [promos, typeF, statusF, channelF, ownerF, searchQuery, lang]);

  // Expansion: default opens every level-1 group (areas visible, promo rows collapsed).
  const [expanded, setExpanded] = useStateApp(() => {
    const s = new Set();
    promos.forEach((p) => s.add('1|' + (CITY_REGION[PARTNERS.find((x) => x.id === p.partnerId)?.city] || 'OTHER')));
    return s;
  });
  useEffectApp(() => {
    const s = new Set();
    filtered.forEach((p) => s.add('1|' + dim1.key(p)));
    setExpanded(s);
  }, [l1, l2]); // reset to "areas open" whenever the row fields change
  const toggle = (key) => setExpanded((s) => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; });
  const expandAll = () => {
    const s = new Set();
    filtered.forEach((p) => { const k1 = dim1.key(p); s.add('1|' + k1); if (dim2) s.add('2|' + k1 + '|' + dim2.key(p)); });
    setExpanded(s);
  };
  const collapseAll = () => setExpanded(new Set());

  const toggleSort = (col) => setSort((s) => (s.col !== col ? { col, dir: 'desc' } : s.dir === 'desc' ? { col, dir: 'asc' } : { col: null, dir: 'desc' }));
  const sortInd = (col) => (sort.col === col ? (sort.dir === 'asc' ? '▲' : '▼') : '↕');

  const { rows, grand, groupCount } = useMemoApp(() => {
    const dir = sort.dir === 'asc' ? 1 : -1;
    const groupCmp = (A, B, dim) => (sort.col ? (((A.agg[sort.col] ?? -1) - (B.agg[sort.col] ?? -1)) * dir) : dim.order(A.k, B.k));
    const leafCmp = (a, b) => (sort.col ? ((leafVal(a, sort.col) - leafVal(b, sort.col)) * dir) : (a.startDate < b.startDate ? 1 : -1));
    const groupOf = (list, dim) => {
      const m = new Map();
      list.forEach((p) => { const k = dim.key(p); if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
      return [...m.entries()].map(([k, l]) => ({ k, list: l, agg: aggPromos(l) }));
    };
    const out = [];
    let gc = 0;
    const g1 = groupOf(filtered, dim1).sort((A, B) => groupCmp(A, B, dim1));
    g1.forEach((a) => {
      gc++;
      const key1 = '1|' + a.k;
      const open1 = expanded.has(key1);
      out.push({ kind: 'group', depth: 0, key: key1, label: dim1.display(a.k), agg: a.agg, open: open1 });
      if (!open1) return;
      if (dim2) {
        const g2 = groupOf(a.list, dim2).sort((A, B) => groupCmp(A, B, dim2));
        g2.forEach((b) => {
          gc++;
          const key2 = '2|' + a.k + '|' + b.k;
          const open2 = expanded.has(key2);
          out.push({ kind: 'group', depth: 1, key: key2, label: dim2.display(b.k), agg: b.agg, open: open2 });
          if (open2) b.list.slice().sort(leafCmp).forEach((p) => out.push({ kind: 'leaf', depth: 2, promo: p }));
        });
      } else {
        a.list.slice().sort(leafCmp).forEach((p) => out.push({ kind: 'leaf', depth: 1, promo: p }));
      }
    });
    return { rows: out, grand: aggPromos(filtered), groupCount: gc };
  }, [filtered, l1, l2, expanded, sort, lang]);

  const owners = useMemoApp(() => [...new Set(promos.map((p) => p.createdBy))], [promos]);
  const channelIds = useMemoApp(() => { const s = new Set(); promos.forEach((p) => p.channelIds.forEach((c) => s.add(c))); return [...s]; }, [promos]);

  const DIM_OPTS = [
    { value: 'region', label: ru ? 'Регион' : 'Region' },
    { value: 'city', label: ru ? 'Город' : 'Area' },
    { value: 'partner', label: t.fields.partner },
    { value: 'segment', label: ru ? 'Сегмент' : 'Segment' },
    { value: 'channel', label: t.fields.channel },
    { value: 'type', label: t.fields.type },
    { value: 'status', label: ru ? 'Статус' : 'Status' },
    { value: 'owner', label: t.fields.createdBy },
  ];
  const TYPE_OPTS = [{ value: 'all', label: ru ? '(Все)' : '(All)' }, { value: 'nplus1', label: 'N + 1' }, { value: 'money', label: 'N + KZT' }];
  const STATUS_OPTS = [{ value: 'all', label: ru ? '(Все)' : '(All)' }, { value: 'active', label: t.status.active }, { value: 'pending', label: t.status.pending }, { value: 'draft', label: t.status.draft }, { value: 'expired', label: t.status.expired }, { value: 'cancelled', label: t.status.cancelled }];

  const hierHeader = dim1.label + (dim2 ? ' / ' + dim2.label : '');
  const moneyCell = (v) => (v ? fmtNum(v) : '—');
  const sortCls = (col) => cls('sort-ind', sort.col === col && sort.dir);

  const renderGroup = (row) => (
    <tr key={row.key} className={cls('pv-group', row.depth === 0 ? 'pv-l1' : 'pv-l2')} onClick={() => toggle(row.key)}>
      <td className="pv-name" style={{ paddingLeft: 12 + row.depth * 20 }}>
        <span className="pv-twisty">{row.open ? '▾' : '▸'}</span>
        <span className="pv-label">{row.label}</span>
      </td>
      <td className="num">{row.agg.outlets}</td>
      <td className="num">{moneyCell(row.agg.quotaMoney)}</td>
      <td className="num">{moneyCell(row.agg.usedMoney)}</td>
      <td className="num">{row.agg.quotaMoney ? fmtNum(row.agg.leftMoney) : '—'}</td>
      <td className={cls('num pv-pct', cfClass(row.agg.ratio))}>{fmtPct(row.agg.ratio)}</td>
    </tr>
  );
  const renderLeaf = (row) => {
    const p = row.promo; const pt = partnerOf(p); const money = p.type === 'money'; const r = promoRatio(p);
    return (
      <tr key={p.code} className="pv-leaf" onClick={() => onSelect(p.code)} title={ru ? 'Открыть промо' : 'Open promo'}>
        <td className="pv-name" style={{ paddingLeft: 12 + row.depth * 20 }}>
          <span className="pv-twisty" />
          <span className="code-tag">{p.code}</span>
          <span className="pv-leaf-sub">{pt?.name}{!money && p.quotaLitres ? ' · ' + fmtLitres(p.quotaLitres) : ''}</span>
        </td>
        <td className="num">{p.salePointIds.length}</td>
        <td className="num">{money ? fmtNum(p.quotaMoney) : '—'}</td>
        <td className="num">{money ? fmtNum(p.usedMoney) : '—'}</td>
        <td className="num">{money ? fmtNum((p.quotaMoney || 0) - (p.usedMoney || 0)) : '—'}</td>
        <td className={cls('num pv-pct', cfClass(r))}>{fmtPct(r)}</td>
      </tr>
    );
  };

  return (
    <>
      <div className="toolbar pivot-toolbar">
        <span className="rf-group">
          <span className="tb-label">{ru ? 'Строки' : 'Rows'}</span>
          <select className="select compact" value={l1} onChange={(e) => setL1(e.target.value)}>
            {DIM_OPTS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
          <span className="rf-arrow">›</span>
          <select className="select compact" value={l2} onChange={(e) => setL2(e.target.value)}>
            <option value="none">{ru ? '— нет —' : '— none —'}</option>
            {DIM_OPTS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </span>
        <span className="tb-div" />
        <span className="rf-group">
          <span className="tb-label">{t.fields.type}</span>
          <select className="select compact" value={typeF} onChange={(e) => setTypeF(e.target.value)}>
            {TYPE_OPTS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </span>
        <span className="rf-group">
          <span className="tb-label">{ru ? 'Статус' : 'Status'}</span>
          <select className="select compact" value={statusF} onChange={(e) => setStatusF(e.target.value)}>
            {STATUS_OPTS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </span>
        <div className="toolbar-spacer" />
        <select className="select compact" value={channelF} onChange={(e) => setChannelF(e.target.value)}>
          <option value="all">{ru ? 'Все каналы' : 'All channels'}</option>
          {channelIds.map((c) => <option key={c} value={c}>{findChannelLabel(c, lang)}</option>)}
        </select>
        <select className="select compact" value={ownerF} onChange={(e) => setOwnerF(e.target.value)}>
          <option value="all">{ru ? 'Все ответственные' : 'All owners'}</option>
          {owners.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>

      <div className="toolbar toolbar-sub">
        <button className="btn sm ghost" onClick={expandAll}>{ru ? 'Развернуть всё' : 'Expand all'}</button>
        <button className="btn sm ghost" onClick={collapseAll}>{ru ? 'Свернуть всё' : 'Collapse all'}</button>
        {sort.col && (<><span className="tb-div" /><button className="btn sm ghost" onClick={() => setSort({ col: null, dir: 'desc' })}><Icon name="close" size={12} />{ru ? 'Сбросить сортировку' : 'Clear sort'}</button></>)}
        <div className="toolbar-spacer" />
        <span className="tb-hint">{filtered.length} {ru ? 'промо' : 'promos'} · {groupCount} {ru ? 'групп' : 'groups'}</span>
      </div>

      <div className="table-wrap pivot-wrap">
        <table className="data pivot">
          <thead>
            <tr>
              <th className="pv-rowhdr">{hierHeader}</th>
              <th className="num sortable" onClick={() => toggleSort('outlets')} title={ru ? 'Точек продаж с промо-заказами' : 'Outlets with promo orders'}><span className="th-inner">{ru ? '# точек' : '# outlets'}<span className={sortCls('outlets')}>{sortInd('outlets')}</span></span></th>
              <th className="num sortable" onClick={() => toggleSort('quotaMoney')}><span className="th-inner">{ru ? 'Квота, ₸' : 'Quota, ₸'}<span className={sortCls('quotaMoney')}>{sortInd('quotaMoney')}</span></span></th>
              <th className="num sortable" onClick={() => toggleSort('usedMoney')}><span className="th-inner">{ru ? 'Реализовано, ₸' : 'Realized, ₸'}<span className={sortCls('usedMoney')}>{sortInd('usedMoney')}</span></span></th>
              <th className="num sortable" onClick={() => toggleSort('leftMoney')}><span className="th-inner">{ru ? 'Остаток, ₸' : 'Left, ₸'}<span className={sortCls('leftMoney')}>{sortInd('leftMoney')}</span></span></th>
              <th className="num sortable" onClick={() => toggleSort('ratio')}><span className="th-inner">{ru ? 'Реализация, %' : 'Realized, %'}<span className={sortCls('ratio')}>{sortInd('ratio')}</span></span></th>
            </tr>
          </thead>
          <tbody>
            {rows.map((row) => (row.kind === 'group' ? renderGroup(row) : renderLeaf(row)))}
          </tbody>
          <tfoot>
            <tr className="pv-total">
              <td className="pv-name" style={{ paddingLeft: 12 }}>{ru ? 'Итого' : 'Total'}</td>
              <td className="num">{grand.outlets}</td>
              <td className="num">{moneyCell(grand.quotaMoney)}</td>
              <td className="num">{moneyCell(grand.usedMoney)}</td>
              <td className="num">{grand.quotaMoney ? fmtNum(grand.leftMoney) : '—'}</td>
              <td className={cls('num pv-pct', cfClass(grand.ratio))}>{fmtPct(grand.ratio)}</td>
            </tr>
          </tfoot>
        </table>
        {filtered.length === 0 && <div className="empty">{t.misc.noResults}</div>}
      </div>
    </>
  );
}

function FilterChips({ label, value, onChange, options }) {
  return (
    <>
      <span style={{ fontSize: 11.5, color: 'var(--text-3)', marginRight: 4, textTransform: 'uppercase', letterSpacing: '.04em', fontWeight: 600 }}>{label}</span>
      {options.map((o) => (
        <button key={o.value} className={cls('chip', value === o.value && 'active')} onClick={() => onChange(o.value)}>
          {o.label}
        </button>
      ))}
    </>
  );
}

function StatTiles({ stats, t, lang }) {
  return (
    <div className="stats">
      <div className="stat">
        <span className="stat-label">{t.summary.totalActive}</span>
        <span className="stat-value">{stats.active}</span>
        <span className="stat-sub"><b>+3</b> {lang === 'ru' ? 'за неделю' : 'this week'}</span>
      </div>
      <div className="stat">
        <span className="stat-label">{t.summary.totalLitres}</span>
        <span className="stat-value">{fmtNum(stats.litres)}<span style={{ fontSize: 14, color: 'var(--text-3)', marginLeft: 4 }}>L</span></span>
        <span className="stat-sub">{lang === 'ru' ? 'по активным N + 1' : 'across active N + 1 promos'}</span>
      </div>
      <div className="stat">
        <span className="stat-label">{t.summary.totalMoney}</span>
        <span className="stat-value">₸{(stats.money / 1000000).toFixed(2)}M</span>
        <span className="stat-sub">{lang === 'ru' ? 'по денежным акциям' : 'across N + KZT'}</span>
      </div>
      <div className="stat">
        <span className="stat-label">{t.summary.pendingRequests}</span>
        <span className="stat-value">{stats.pendingReq}</span>
        <span className="stat-sub">{lang === 'ru' ? 'ожидают решения' : 'waiting for decision'}</span>
      </div>
    </div>
  );
}

// ===== Requests =====
function RequestsView({ t, lang, requests, setRequests, aiVariant, pushToast }) {
  return (
    <>
      <div className="page-title">
        <div>
          <h1>{t.nav.requests}</h1>
          <p>{lang === 'ru' ? 'Заявки от партнёров на компенсации с автоматической AI-сверкой.' : 'Partner compensation requests with automatic AI cross-check.'}</p>
        </div>
        <div className="page-actions">
          <button className="btn"><Icon name="excel" size={14} />{t.actions.export}</button>
        </div>
      </div>
      <RequestsPanel t={t} lang={lang} requests={requests} setRequests={setRequests} aiVariant={aiVariant} pushToast={pushToast} />
    </>
  );
}

// ===== Partners =====
function PartnersView({ t, lang, promos }) {
  return (
    <>
      <div className="page-title"><div><h1>{t.nav.partners}</h1><p>{lang === 'ru' ? 'Иерархия партнёров, точек продаж и каналов.' : 'Partner hierarchy with sale points and channels.'}</p></div></div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12 }}>
        {PARTNERS.map((p) => {
          const cnt = promos.filter((pp) => pp.partnerId === p.id).length;
          return (
            <div key={p.id} className="section" style={{ marginBottom: 0 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div>
                  <span className="code-tag" style={{ fontSize: 11 }}>{p.code}</span>
                  <h3 style={{ margin: '6px 0 2px', textTransform: 'none', letterSpacing: 0, fontSize: 16 }}>{p.name}</h3>
                  <div style={{ fontSize: 12, color: 'var(--text-3)' }}>{p.city}</div>
                </div>
                <Badge kind={p.segment === 'ontrade' ? 'info' : ''}>{p.segment === 'ontrade' ? 'On trade' : 'Off trade'}</Badge>
              </div>
              <div style={{ marginTop: 12, display: 'grid', gap: 6 }}>
                {p.salePoints.map((s) => (
                  <div key={s.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 8px', borderTop: '1px solid var(--border)', fontSize: 12.5 }}>
                    <span><Icon name="package" size={12} /> {s.name}<span style={{ color: 'var(--text-3)' }}> · {s.address}</span></span>
                    <span style={{ color: 'var(--text-3)', fontSize: 11 }}>{findChannelLabel(s.channel, lang)}</span>
                  </div>
                ))}
              </div>
              <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--text-3)' }}>
                {cnt} {lang === 'ru' ? 'промо-активностей' : 'promo-activities'}
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

// ===== Products =====
function ProductsView({ t, lang, promos }) {
  return (
    <>
      <div className="page-title"><div><h1>{t.nav.products}</h1><p>{lang === 'ru' ? 'Каталог продуктов Efes, доступных для промо.' : 'Product catalogue eligible for promo activities.'}</p></div></div>
      <div className="table-wrap">
        <table className="data">
          <thead><tr><th>SKU</th><th>{lang === 'ru' ? 'Продукт' : 'Product'}</th><th>{lang === 'ru' ? 'Объём' : 'Volume'}</th><th>{lang === 'ru' ? 'Активных промо' : 'In active promos'}</th></tr></thead>
          <tbody>
            {PRODUCTS.map((p) => {
              const cnt = promos.filter((pp) => pp.products.includes(p.sku) && pp.status === 'active').length;
              return (
                <tr key={p.sku}>
                  <td><span className="code-tag">{p.sku}</span></td>
                  <td>{p.name}</td>
                  <td className="cell-num">{p.volume} L</td>
                  <td><Badge>{cnt}</Badge></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
